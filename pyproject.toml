[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mercadolibre-mcp"
version = "0.1.0"
description = "Servidor MCP local para administrar Mercado Libre mediante su API oficial"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mercadolibre-mcp = "meli_mcp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/meli_mcp"]
