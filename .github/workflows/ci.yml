name: Verify Windows 11 package
on:
  push:
permissions:
  contents: read
  actions: read
jobs:
  windows-11:
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mercadolibre-mcp-windows-x86_64
          path: windows-zip
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44828739212
      - name: Exercise Windows ZIP with system PowerShell and CMD
        shell: powershell
        run: ./packaging/windows/smoke-test.ps1 -Zip ./windows-zip/mercadolibre-mcp-windows-x86_64.zip
