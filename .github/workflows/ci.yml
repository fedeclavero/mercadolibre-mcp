name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo +stable test --locked --all-targets
      - name: Verify Cargo package
        if: runner.os == 'Linux'
        run: cargo +stable package --locked --no-verify
      - name: Build executable
        run: cargo +stable build --locked --release
      - name: Package executable (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p package
          cp target/release/mercadolibre-mcp LICENSE package/
          tar -czf "mercadolibre-mcp-${PLATFORM}.tar.gz" -C package mercadolibre-mcp LICENSE
      - name: Package executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'target/release/mercadolibre-mcp.exe','LICENSE' -DestinationPath 'mercadolibre-mcp-windows-x86_64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mercadolibre-mcp-${{ matrix.platform }}
          path: |
            mercadolibre-mcp-*.tar.gz
            mercadolibre-mcp-*.zip
          if-no-files-found: error
